<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Terri Burgers</title><style>:root{--r:#d51d31;--y:#ffca28;--d:#20130e;--b:#fff7ed;--line:#eadbd0}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--b);color:var(--d);padding-bottom:90px}header{position:sticky;top:0;z-index:2;background:linear-gradient(135deg,#23130d,#6b1c10);color:#fff;padding:18px}.brand{max-width:900px;margin:auto;display:flex;align-items:center;gap:10px}.logo{background:var(--y);border-radius:12px;padding:9px;font-size:25px}.brand h1{margin:0;font-size:23px}.brand p{margin:3px 0 0;font-size:12px;color:#ffe8bf}.badge{margin-left:auto;border:0;border-radius:10px;background:var(--r);color:#fff;padding:10px;cursor:pointer}main{max-width:900px;margin:auto;padding:16px}.notice{font-size:12px;background:#fff0bd;padding:11px;border-radius:10px;margin-bottom:12px}.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px;font-size:15px}.tabs{display:flex;gap:7px;overflow:auto;padding:13px 0 5px}.tabs button{white-space:nowrap;border:1px solid var(--line);padding:9px 12px;border-radius:99px;background:#fff;cursor:pointer}.tabs .on{background:var(--r);color:#fff;border-color:var(--r)}h2{font-size:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden}.pic{height:100px;display:grid;place-items:center;font-size:58px;background:#ffe5c4}.card:nth-child(3n+2) .pic{background:#eedcff}.card:nth-child(3n) .pic{background:#dff2e4}.pad{padding:12px}.type{color:var(--r);font-size:10px;font-weight:bold;text-transform:uppercase}.name{font-size:16px;font-weight:bold;margin:5px 0}.desc{font-size:12px;color:#7a6257;min-height:30px}.price{font-weight:bold;margin:10px 0}.bs{display:block;font-weight:normal;font-size:12px;color:#7a6257;margin-top:2px}.add,.modaladd{width:100%;border:0;border-radius:10px;background:var(--r);color:white;font-weight:bold;padding:11px;cursor:pointer}.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:11px 16px;border-top:1px solid var(--line);z-index:3}.barin{max-width:900px;margin:auto;display:flex;align-items:center;gap:10px}.total{flex:1;font-size:13px}.total b{display:block;font-size:16px}.view,.whatsapp{border:0;border-radius:10px;padding:13px;background:#1ca957;color:#fff;font-weight:bold;cursor:pointer}.view:disabled{opacity:.5}dialog{border:0;border-radius:18px;width:min(560px,calc(100% - 26px));padding:0;box-shadow:0 15px 60px #0008}dialog::backdrop{background:#0008}.modal{padding:18px;max-height:88vh;overflow:auto}.close{float:right;border:0;border-radius:50%;font-size:20px;width:31px;height:31px;cursor:pointer}.modal h3{margin:0 35px 6px 0}.choice{display:flex;align-items:center;gap:8px;padding:9px;border:1px solid var(--line);border-radius:9px;margin:6px 0;font-size:14px}.choice span{margin-left:auto;color:#795d50}.note,input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit}.qty{display:flex;gap:12px;align-items:center;margin:14px 0}.qty button{border:0;border-radius:8px;font-size:20px;width:34px;height:34px;cursor:pointer}.item{padding:11px 0;border-bottom:1px solid var(--line)}.itemtop{display:flex;justify-content:space-between;gap:8px}.item small{display:block;color:#795d50;margin-top:4px}.remove{color:var(--r);background:transparent;border:0;padding:4px 0;cursor:pointer}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.form label{font-size:12px;font-weight:bold}.wide{grid-column:1/-1}.hidden{display:none}@media(max-width:430px){.grid{grid-template-columns:repeat(2,1fr);gap:9px}.pic{height:82px;font-size:48px}.pad{padding:10px}.name{font-size:14px}.desc{font-size:11px}.form{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><header><div class="brand"><div class="logo">🍔</div><div><h1>Terri Burgers</h1><p>Date un gustazo · Pedidos rápidos</p></div><button class="badge" onclick="showCart()">🛒 <span id="count">0</span></button></div></header><main><div class="notice">💵 Precios en USD y bolívares. Tasa referencial: <b id="rate"></b> por US$1.</div><input class="search" id="search" placeholder="¿Qué producto buscas?" oninput="draw()"><div class="tabs" id="tabs"></div><h2 id="title">Todo el menú</h2><div class="grid" id="list"></div></main><div class="bar"><div class="barin"><div class="total"><span id="label">Tu carrito está vacío</span><b id="total">US$0,00 · Bs. 0,00</b></div><button class="view" id="view" onclick="showCart()" disabled>Ver pedido</button></div></div><dialog id="prod"><div class="modal"><button class="close" onclick="prod.close()">×</button><h3 id="ptitle"></h3><p id="pbase"></p><div id="opts"></div><h4>Observaciones</h4><textarea id="note" rows="2" placeholder="Ej.: poca salsa, bien tostado…"></textarea><div class="qty"><button onclick="q=Math.max(1,q-1);qv.textContent=q">−</button><b id="qv">1</b><button onclick="q++;qv.textContent=q">+</button></div><button class="modaladd" onclick="addCart()">Añadir al carrito</button></div></dialog><dialog id="cart"><div class="modal"><button class="close" onclick="cart.close()">×</button><h3>Tu pedido</h3><div id="items"></div><div id="form" class="hidden"><h4>Datos para el pedido</h4><div class="form"><label>Nombre<input id="cn" placeholder="Tu nombre"></label><label>Teléfono<input id="cp" placeholder="0414 0000000"></label><label>Entrega<select id="del" onchange="addrbox.classList.toggle('hidden',this.value==='Retiro en el local')"><option>Domicilio</option><option>Retiro en el local</option></select></label><label>Pago<select id="pay"><option>Efectivo USD</option><option>Bolívares</option><option>Pago móvil</option><option>Transferencia</option><option>Binance</option></select></label><label id="addrbox" class="wide">Dirección y referencia<textarea id="addr" rows="2"></textarea></label><label class="wide">Nota adicional<textarea id="onote" rows="2"></textarea></label></div><button class="whatsapp" onclick="whatsapp()">Enviar pedido por WhatsApp</button></div></div></dialog><script>const R=876.79,P='584145530136';const data=[['Hamburguesas','Whopper Mini',2.5,'🍔','Carne, queso, vegetales y salsas'],['Hamburguesas','Whopper Clásica',3.5,'🍔','Carne, jamón, queso y vegetales'],['Hamburguesas','Terri Sencilla',5,'🍔','Carne, jamón, queso y salsas de la casa'],['Hamburguesas','Terri Especial',6.5,'🍔','Carne, huevo, tocineta, queso y vegetales'],['Perros calientes','Pan Pequeño',1.5,'🌭','Salchicha, vegetales y salsas'],['Perros calientes','Pan Grande',2,'🌭','Salchicha, vegetales y salsas'],['Perros calientes','Pequeño con Huevo',2.5,'🌭','Salchicha, huevo, vegetales y salsas'],['Perros calientes','Grande Supremo',3.5,'🌭','Salchicha, huevo, tocineta y vegetales'],['Perros calientes','Chori Terri',4,'🌭','Chorizo, vegetales y salsas'],['Perros calientes','Perro Especial',5.5,'🌭','Salchicha, tocineta, queso y vegetales'],['Combos','Combo Terri',8,'🥤','Perro especial + bebida'],['Bebidas','Refresco Sum',1,'🥤','Bebida individual']].map((x,i)=>({id:i,cat:x[0],name:x[1],price:x[2],emoji:x[3],desc:x[4]}));let active='Todo',sel,q=1,basket=[];const usd=x=>'US$'+x.toFixed(2).replace('.',','),ves=x=>'Bs. '+(x*R).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2});rate.textContent=ves(1);function tabsDraw(){let cs=['Todo',...new Set(data.map(x=>x.cat))];tabs.innerHTML=cs.map(x=>`<button class="${x===active?'on':''}" onclick="active='${x}';tabsDraw();draw()">${x}</button>`).join('')}function draw(){let s=search.value.toLowerCase(),a=data.filter(x=>(active==='Todo'||x.cat===active)&&(x.name+x.desc).toLowerCase().includes(s));title.textContent=active==='Todo'?'Todo el menú':active;list.innerHTML=a.map(x=>`<div class="card"><div class="pic">${x.emoji}</div><div class="pad"><div class="type">${x.cat}</div><div class="name">${x.name}</div><div class="desc">${x.desc}</div><div class="price">${usd(x.price)}<span class="bs">${ves(x.price)}</span></div><button class="add" onclick="config(${x.id})">Personalizar</button></div></div>`).join('')}function config(id){sel=data.find(x=>x.id===id);q=1;qv.textContent=1;ptitle.textContent=sel.name;pbase.textContent='Precio base: '+usd(sel.price)+' · '+ves(sel.price);note.value='';let groups=[['Cebolla','onion','radio',[['Sin cebolla',0],['Poca cebolla',0],['Cebolla normal',0],['Mucha cebolla',.25]]],['Salsas','sauce','checkbox',[['Kétchup',0],['Mayonesa',0],['Mostaza',0],['Salsa rosada',0],['Salsa de ajo',0]]],['Extras','extra','checkbox',[['Queso extra',.75],['Huevo extra',.75],['Tocineta extra',1],['Carne extra',2]]]];opts.innerHTML=groups.map(g=>'<h4>'+g[0]+'</h4>'+g[3].map((z,i)=>`<label class="choice"><input type="${g[2]}" name="${g[1]}" value="${z[0]}" data-p="${z[1]}" ${g[2]==='radio'&&i===2?'checked':''}>${z[0]}${z[1]?'<span>+'+usd(z[1])+'</span>':''}</label>`).join('')).join('');prod.showModal()}function addCart(){let os=[...opts.querySelectorAll('input:checked')].map(x=>({n:x.value,p:+x.dataset.p})),u=sel.price+os.reduce((a,x)=>a+x.p,0);basket.push({id:Date.now(),n:sel.name,q,os,note:note.value,u});prod.close();update()}function update(){let n=basket.reduce((a,x)=>a+x.q,0),t=basket.reduce((a,x)=>a+x.q*x.u,0);count.textContent=n;label.textContent=n?n+' producto'+(n>1?'s':'')+' en el carrito':'Tu carrito está vacío';total.textContent=usd(t)+' · '+ves(t);view.disabled=!n}function showCart(){if(!basket.length)return;form.classList.add('hidden');items.innerHTML=basket.map(x=>`<div class="item"><div class="itemtop"><b>${x.q} × ${x.n}</b><b>${usd(x.q*x.u)}</b></div><small>${x.os.map(o=>o.n+(o.p?' (+'+usd(o.p)+')':'')).join(' · ')}${x.note?'<br>Nota: '+x.note:''}</small><button class="remove" onclick="basket=basket.filter(y=>y.id!==${x.id});update();showCart()">Eliminar</button></div>`).join('')+`<p><b>Total: ${usd(basket.reduce((a,x)=>a+x.q*x.u,0))} · ${ves(basket.reduce((a,x)=>a+x.q*x.u,0))}</b><br><small>El envío se confirma según la zona.</small></p><button class="modaladd" onclick="form.classList.remove('hidden')">Continuar con mis datos</button>`;cart.showModal()}function whatsapp(){if(!cn.value.trim()||!cp.value.trim()||(del.value==='Domicilio'&&!addr.value.trim()))return alert('Completa nombre, teléfono y dirección para domicilio.');let t=basket.reduce((a,x)=>a+x.q*x.u,0),m=['Hola, Terri Burgers. Quiero realizar este pedido:',''];basket.forEach(x=>{m.push(`${x.q} × ${x.n} — ${usd(x.q*x.u)} / ${ves(x.q*x.u)}`);x.os.forEach(o=>m.push('   - '+o.n+(o.p?' (+'+usd(o.p)+')':'')));if(x.note)m.push('   - Nota: '+x.note);m.push('')});m.push('TOTAL: '+usd(t)+' / '+ves(t),'Tasa usada: '+ves(1)+' por US$1','',`Entrega: ${del.value}`,`Nombre: ${cn.value}`,`Teléfono: ${cp.value}`);if(del.value==='Domicilio')m.push('Dirección: '+addr.value);m.push('Pago: '+pay.value);if(onote.value.trim())m.push('Nota adicional: '+onote.value);m.push('','Por favor, confirmen disponibilidad y costo del envío.');open('https://wa.me/'+P+'?text='+encodeURIComponent(m.join('\n')),'_blank')}tabsDraw();draw();update();</script></body></html>
