<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Terri Burgers</title><style>
:root{--red:#d51e32;--gold:#ffc928;--dark:#21130e;--bg:#fff5e9;--line:#eadbd0;--green:#1baa5a}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--dark);padding-bottom:92px}header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#24140e,#6a1b10);color:#fff;padding:17px}.head{max-width:920px;margin:auto;display:flex;align-items:center;gap:11px}.logo{width:48px;height:48px;display:grid;place-items:center;background:var(--gold);border-radius:14px;font-size:27px}.head h1{margin:0;font-size:24px}.head p{margin:3px 0 0;color:#ffe5b6;font-size:12px}.head button{margin-left:auto;background:var(--red);color:#fff;border:0;border-radius:12px;padding:10px;cursor:pointer}main{max-width:920px;margin:auto;padding:15px}.notice{font-size:12px;background:#fff0bd;border-radius:11px;padding:11px;margin-bottom:12px}.search{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font-size:15px}.tabs{display:flex;gap:7px;overflow:auto;padding:13px 0 4px}.tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 12px;cursor:pointer}.tabs button.active{background:var(--red);border-color:var(--red);color:#fff}h2{font-size:20px;margin:18px 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden}.pic{height:103px;display:grid;place-items:center;background:#ffe5c2;font-size:59px}.card:nth-child(3n+2) .pic{background:#eeddf9}.card:nth-child(3n) .pic{background:#dff1e5}.pad{padding:12px}.type{font-size:10px;text-transform:uppercase;color:var(--red);font-weight:bold}.name{font-weight:bold;font-size:16px;margin:5px 0}.desc{color:#7c6255;font-size:12px;min-height:30px}.price{font-weight:bold;margin:10px 0}.bs{display:block;color:#7c6255;font-size:12px;font-weight:normal;margin-top:2px}.btn{width:100%;border:0;border-radius:10px;background:var(--red);color:#fff;padding:11px;font-weight:bold;cursor:pointer}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:8;background:#fff;padding:11px 15px;border-top:1px solid var(--line)}.bottomin{max-width:920px;margin:auto;display:flex;align-items:center;gap:10px}.summary{flex:1;font-size:13px}.summary b{display:block;font-size:16px}.view,.send{border:0;border-radius:11px;background:var(--green);color:#fff;padding:13px 15px;font-weight:bold;cursor:pointer}.view:disabled{opacity:.5}.overlay{display:none;position:fixed;z-index:10;inset:0;background:#0009;padding:14px;align-items:center;justify-content:center}.overlay.show{display:flex}.box{background:#fff;width:min(570px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:18px}.close{float:right;border:0;border-radius:50%;width:32px;height:32px;font-size:20px;cursor:pointer}.box h3{margin:2px 38px 7px 0}.base{color:#7c6255}.choice{display:flex;align-items:center;gap:8px;padding:9px;border:1px solid var(--line);border-radius:10px;margin:6px 0;font-size:14px}.choice span{margin-left:auto;color:#76594c}.box h4{font-size:14px;margin:17px 0 8px}.box textarea,.box input,.box select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit}.qty{display:flex;gap:13px;align-items:center;margin:14px 0}.qty button{width:34px;height:34px;border:0;border-radius:8px;font-size:20px;cursor:pointer}.item{padding:11px 0;border-bottom:1px solid var(--line)}.itemtop{display:flex;justify-content:space-between;gap:8px}.item small{display:block;color:#795e51;margin-top:4px}.remove{background:transparent;border:0;color:var(--red);padding:5px 0;cursor:pointer}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.formgrid label{font-size:12px;font-weight:bold}.wide{grid-column:1/-1}.hidden{display:none}@media(max-width:430px){.grid{grid-template-columns:repeat(2,1fr);gap:9px}.pic{height:83px;font-size:48px}.pad{padding:10px}.name{font-size:14px}.desc{font-size:11px}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head>
<body><header><div class="head"><div class="logo">🍔</div><div><h1>Terri Burgers</h1><p>Date un gustazo · Pedidos rápidos</p></div><button onclick="openCart()">🛒 <span id="count">0</span></button></div></header><main><div class="notice">💵 Precios en USD y bolívares. Tasa referencial: <b id="rateText"></b> por US$1.</div><input id="search" class="search" placeholder="¿Qué producto buscas?" oninput="render()"><div id="tabs" class="tabs"></div><h2 id="heading">Todo el menú</h2><div id="products" class="grid"></div></main><div class="bottom"><div class="bottomin"><div class="summary"><span id="label">Tu carrito está vacío</span><b id="total">US$0,00 · Bs. 0,00</b></div><button id="view" class="view" onclick="openCart()" disabled>Ver pedido</button></div></div>
<div class="overlay" id="productPanel"><div class="box"><button class="close" onclick="closePanel('productPanel')">×</button><h3 id="productTitle"></h3><p class="base" id="productBase"></p><div id="options"></div><h4>Observaciones</h4><textarea id="productNote" rows="2" placeholder="Ej.: poca salsa, bien tostado…"></textarea><div class="qty"><button onclick="quantity=Math.max(1,quantity-1);document.getElementById('qty').textContent=quantity">−</button><b id="qty">1</b><button onclick="quantity++;document.getElementById('qty').textContent=quantity">+</button></div><button class="btn" onclick="addToCart()">Añadir al carrito</button></div></div>
<div class="overlay" id="cartPanel"><div class="box"><button class="close" onclick="closePanel('cartPanel')">×</button><h3>Tu pedido</h3><div id="cartItems"></div><div id="customerData" class="hidden"><h4>Datos para el pedido</h4><div class="formgrid"><label>Nombre<input id="customerName" placeholder="Tu nombre"></label><label>Teléfono<input id="customerPhone" placeholder="0414 0000000"></label><label>Entrega<select id="delivery" onchange="document.getElementById('addressBox').classList.toggle('hidden',this.value==='Retiro en el local')"><option>Domicilio</option><option>Retiro en el local</option></select></label><label>Pago<select id="payment"><option>Efectivo USD</option><option>Bolívares</option><option>Pago móvil</option><option>Transferencia</option><option>Binance</option></select></label><label class="wide" id="addressBox">Dirección y referencia<textarea id="address" rows="2" placeholder="Sector, calle, casa y punto de referencia"></textarea></label><label class="wide">Nota adicional<textarea id="orderNote" rows="2"></textarea></label></div><button class="send" style="width:100%;margin-top:15px" onclick="sendOrder()">Enviar pedido por WhatsApp</button></div></div></div>
<script>
const RATE=876.79, WHATSAPP='584145530136';
const menu=[
['Hamburguesas','Whopper Mini',2.5,'🍔','Carne, queso, vegetales y salsas'],['Hamburguesas','Whopper Clásica',3.5,'🍔','Carne, jamón, queso y vegetales'],['Hamburguesas','Terri Sencilla',5,'🍔','Carne, jamón, queso y salsas de la casa'],['Hamburguesas','Terri Especial',6.5,'🍔','Carne, huevo, tocineta, queso y vegetales'],['Perros calientes','Pan Pequeño',1.5,'🌭','Salchicha, vegetales y salsas'],['Perros calientes','Pan Grande',2,'🌭','Salchicha, vegetales y salsas'],['Perros calientes','Pequeño con Huevo',2.5,'🌭','Salchicha, huevo, vegetales y salsas'],['Perros calientes','Grande Supremo',3.5,'🌭','Salchicha, huevo, tocineta y vegetales'],['Perros calientes','Chori Terri',4,'🌭','Chorizo, vegetales y salsas'],['Perros calientes','Perro Especial',5.5,'🌭','Salchicha, tocineta, queso y vegetales'],['Combos','Combo Terri',8,'🥤','Perro especial + bebida'],['Bebidas','Refresco Sum',1,'🥤','Bebida individual']
].map((x,i)=>({id:i,category:x[0],name:x[1],price:x[2],emoji:x[3],description:x[4]}));
let category='Todo', selected=null, quantity=1, cart=[];
const usd=n=>'US$'+n.toFixed(2).replace('.',','); const bs=n=>'Bs. '+(n*RATE).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2});
document.getElementById('rateText').textContent=bs(1);
function renderTabs(){const cats=['Todo',...new Set(menu.map(p=>p.category))];document.getElementById('tabs').innerHTML=cats.map(c=>`<button class="${category===c?'active':''}" onclick="category='${c}';renderTabs();render()">${c}</button>`).join('')}
function render(){const query=document.getElementById('search').value.toLowerCase();const list=menu.filter(p=>(category==='Todo'||p.category===category)&&(p.name+' '+p.description).toLowerCase().includes(query));document.getElementById('heading').textContent=category==='Todo'?'Todo el menú':category;document.getElementById('products').innerHTML=list.map(p=>`<article class="card"><div class="pic">${p.emoji}</div><div class="pad"><div class="type">${p.category}</div><div class="name">${p.name}</div><div class="desc">${p.description}</div><div class="price">${usd(p.price)}<span class="bs">${bs(p.price)}</span></div><button class="btn" onclick="configure(${p.id})">Personalizar</button></div></article>`).join('')}
function openPanel(id){document.getElementById(id).classList.add('show')}function closePanel(id){document.getElementById(id).classList.remove('show')}
function configure(id){selected=menu.find(p=>p.id===id);quantity=1;document.getElementById('qty').textContent='1';document.getElementById('productTitle').textContent=selected.name;document.getElementById('productBase').textContent='Precio base: '+usd(selected.price)+' · '+bs(selected.price);document.getElementById('productNote').value='';const groups=[['Cebolla','onion','radio',[['Sin cebolla',0],['Poca cebolla',0],['Cebolla normal',0],['Mucha cebolla',.25]]],['Salsas','sauce','checkbox',[['Kétchup',0],['Mayonesa',0],['Mostaza',0],['Salsa rosada',0],['Salsa de ajo',0]]],['Extras','extra','checkbox',[['Queso extra',.75],['Huevo extra',.75],['Tocineta extra',1],['Carne extra',2]]]];document.getElementById('options').innerHTML=groups.map(g=>'<h4>'+g[0]+'</h4>'+g[3].map((o,i)=>`<label class="choice"><input type="${g[2]}" name="${g[1]}" value="${o[0]}" data-price="${o[1]}" ${g[2]==='radio'&&i===2?'checked':''}>${o[0]}${o[1]?'<span>+'+usd(o[1])+'</span>':''}</label>`).join('')).join('');openPanel('productPanel')}
function addToCart(){const choices=[...document.querySelectorAll('#options input:checked')].map(x=>({name:x.value,price:Number(x.dataset.price)}));const unit=selected.price+choices.reduce((sum,x)=>sum+x.price,0);cart.push({id:Date.now(),name:selected.name,quantity,choices,note:document.getElementById('productNote').value.trim(),unit});closePanel('productPanel');updateCart()}
function updateCart(){const units=cart.reduce((sum,x)=>sum+x.quantity,0),amount=cart.reduce((sum,x)=>sum+x.unit*x.quantity,0);document.getElementById('count').textContent=units;document.getElementById('label').textContent=units?units+' producto'+(units===1?'':'s')+' en el carrito':'Tu carrito está vacío';document.getElementById('total').textContent=usd(amount)+' · '+bs(amount);document.getElementById('view').disabled=!cart.length}
function openCart(){if(!cart.length)return;document.getElementById('customerData').classList.add('hidden');renderCart();openPanel('cartPanel')}
function renderCart(){const area=document.getElementById('cartItems');const amount=cart.reduce((sum,x)=>sum+x.unit*x.quantity,0);area.innerHTML=cart.map(x=>`<div class="item"><div class="itemtop"><b>${x.quantity} × ${x.name}</b><b>${usd(x.unit*x.quantity)}</b></div><small>${x.choices.map(o=>o.name+(o.price?' (+'+usd(o.price)+')':'')).join(' · ')||'Sin cambios'}${x.note?'<br>Nota: '+x.note:''}</small><button class="remove" onclick="removeProduct(${x.id})">Eliminar</button></div>`).join('')+`<p><b>Total: ${usd(amount)} · ${bs(amount)}</b><br><small>El envío se confirma según la zona.</small></p><button class="btn" onclick="showCustomerForm()">Continuar con mis datos</button>`}
function removeProduct(id){cart=cart.filter(x=>x.id!==id);updateCart();if(!cart.length){closePanel('cartPanel')}else{renderCart()}}
function showCustomerForm(){document.getElementById('customerData').classList.remove('hidden');document.getElementById('customerData').scrollIntoView({behavior:'smooth',block:'start'})}
function sendOrder(){const name=document.getElementById('customerName').value.trim(),phone=document.getElementById('customerPhone').value.trim(),delivery=document.getElementById('delivery').value,payment=document.getElementById('payment').value,address=document.getElementById('address').value.trim();if(!name||!phone||(delivery==='Domicilio'&&!address)){alert('Completa nombre, teléfono y dirección para domicilio.');return}const amount=cart.reduce((sum,x)=>sum+x.unit*x.quantity,0);const text=['Hola, Terri Burgers. Quiero realizar este pedido:',''];cart.forEach(x=>{text.push(`${x.quantity} × ${x.name} — ${usd(x.unit*x.quantity)} / ${bs(x.unit*x.quantity)}`);x.choices.forEach(o=>text.push('   - '+o.name+(o.price?' (+'+usd(o.price)+')':'')));if(x.note)text.push('   - Nota: '+x.note);text.push('')});text.push('TOTAL: '+usd(amount)+' / '+bs(amount),'Tasa usada: '+bs(1)+' por US$1','',`Entrega: ${delivery}`,`Nombre: ${name}`,`Teléfono: ${phone}`);if(delivery==='Domicilio')text.push('Dirección: '+address);text.push('Pago: '+payment);const note=document.getElementById('orderNote').value.trim();if(note)text.push('Nota adicional: '+note);text.push('','Por favor, confirmen disponibilidad y costo del envío.');window.open('https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(text.join('\n')),'_blank')}
renderTabs();render();updateCart();
</script></body></html>
